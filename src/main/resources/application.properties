spring.application.name=backend
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/soda_roja
spring.datasource.username=root
spring.datasource.password=root

# ===== CONFIGURACIÓN DE BASE DE DATOS =====
# OPCIÓN 1: Para DESARROLLO - Reinicia BD con seeder
# spring.jpa.hibernate.ddl-auto=create-drop

# OPCIÃÓN 2: Para PRODUCCIÓ“N - Preserva datos (recomendado)
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true


# ===== CONFIGURACIÓ“N DE ERRORES (comentadas por defecto) =====
#server.error.include-message=never
#server.error.include-binding-errors=never
#server.error.include-stacktrace=never
#server.error.include-exception=false

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
